name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format, vet, test, validate catalog and docs
        run: make check
      - name: Compose files are valid
        run: make compose-config
      - name: Build for macOS (Apple Silicon and Intel)
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/homelab
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/homelab
      - name: Build for Linux and Windows
        run: |
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/homelab
          GOOS=windows GOARCH=amd64 go vet ./... && GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/homelab

  # Known vulnerabilities (govulncheck, npm audit) and risky code (gosec):
  # make security. A new advisory can turn this red without a change here;
  # docs/Security.md#the-apps-own-code says what to do then.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: govulncheck, gosec, and npm audit
        run: make security

  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      # The runners' Azure mirror has been taking tens of seconds a package:
      # the downloads are kept between runs, so only a changed package list
      # fetches again, and Ubuntu's own archive is asked first.
      - name: Packages downloaded on earlier runs
        uses: actions/cache@v5
        with:
          path: ~/apt-archives
          key: apt-gtk-webkit-ubuntu-24.04-v1
      - name: Install GTK and WebKitGTK
        timeout-minutes: 15
        run: |
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            if [ -f "$f" ]; then sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' "$f"; fi
          done
          mkdir -p ~/apt-archives/partial
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives"
          $apt update
          $apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          sudo chown -R "$USER" ~/apt-archives
      - name: Build the desktop app for Linux, and for Windows without cgo
        run: |
          (cd app && test -z "$(gofmt -l .)" && go vet -tags desktop,production,webkit2_41 ./... && go test ./... && go build -tags desktop,production,webkit2_41 -o /dev/null .)
          make app-check
      - name: Frontend scripts parse, and every element they look up exists
        run: make frontend-check
