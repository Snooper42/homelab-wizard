name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Format, vet, test, validate catalog and docs
        run: make check
      - name: Each package's coverage at or above its floor
        run: make coverage
      - name: Compose files are valid
        run: make compose-config
      - name: Build for macOS (Apple Silicon and Intel)
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/homelab
          GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/homelab
      - name: Build for Linux and Windows
        run: |
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/homelab
          GOOS=windows GOARCH=amd64 go vet ./... && GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/homelab
      # A person's jobs run without a sign-in once lingering is on (doctor
      # says so); the runner has no login session, so it is turned on here.
      - name: The scheduled jobs installed, run, and removed for real (systemd user units)
        run: |
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for i in $(seq 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          go test -tags forreal -run JobsInstalledForReal -count=1 -v ./cmd/homelab
      - name: A drive, the sleep setting, and the power state, made and read for real
        run: go test -tags forreal -run 'ExternalDriveForReal|SleepSettingForReal|PowerStateForReal' -count=1 -v ./internal/diskspace ./internal/battery ./cmd/homelab
      # Last: it restarts systemd-resolved, which the runner's own lookups use.
      - name: This machine's names written and taken back for real (sudo, no password on the runner)
        run: go test -tags forreal -run ChangedForReal -count=1 -v ./internal/domain

  # Known vulnerabilities (govulncheck, npm audit) and risky code (gosec):
  # make security. A new advisory can turn this red without a change here;
  # docs/Security.md#the-apps-own-code says what to do then.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: govulncheck, gosec, and npm audit
        run: make security

  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      # The runners' Azure mirror has been taking tens of seconds a package:
      # the downloads are kept between runs, so only a changed package list
      # fetches again, and Ubuntu's own archive is asked first.
      - name: Packages downloaded on earlier runs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/apt-archives
          key: apt-gtk-webkit-ubuntu-24.04-v1
      - name: Install GTK and WebKitGTK
        timeout-minutes: 15
        run: |
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            if [ -f "$f" ]; then sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' "$f"; fi
          done
          mkdir -p ~/apt-archives/partial
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives"
          $apt update
          $apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          sudo chown -R "$USER" ~/apt-archives
      - name: Build the desktop app for Linux, and for Windows without cgo
        run: |
          (cd app && test -z "$(gofmt -l .)" && go vet -tags desktop,production,webkit2_41 ./... && go test ./... && go build -tags desktop,production,webkit2_41 -o /dev/null .)
          make app-check
      - name: Frontend scripts parse, and every element they look up exists
        run: make frontend-check

  # The Go tests on macOS and Windows as well (Ubuntu runs them in check
  # and app): each system's own files (*_darwin.go, *_windows.go) are
  # tested on that system. The end-to-end tests' fake docker is the test
  # binary itself (cmd/homelab/fakebin_test.go), so it runs on each.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: |
            go.sum
            app/go.sum
      - name: The CLI and the engine
        run: go test ./...
      - name: The desktop app
        working-directory: app
        run: go test ./...
      - name: The scheduled jobs installed, run, and removed for real (launchd on macOS, the Run key on Windows)
        run: go test -tags forreal -run JobsInstalledForReal -count=1 -v ./cmd/homelab
      - name: A drive, the sleep setting, and the power state, made and read for real (a disk image on macOS, a VHD on Windows)
        run: go test -tags forreal -run 'ExternalDriveForReal|SleepSettingForReal|PowerStateForReal' -count=1 -v ./internal/diskspace ./internal/battery ./cmd/homelab
      - name: This machine's names written and taken back for real (sudo on macOS, the approval on Windows, which the runner gives)
        run: go test -tags forreal -run ChangedForReal -count=1 -v ./internal/domain

  # The app clicked through against the fake backend (make app-smoke), in
  # light and dark: every smoke check, then each screen as each system,
  # with and without more contrast, through axe (WCAG 2.1 AA, serious and
  # critical findings fail) and a layout check. A failing run keeps its
  # screenshots.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        scheme: [light, dark]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Playwright and Chromium
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Click through, and check each screen
        run: node app/preview/shoot.mjs --smoke ${{ matrix.scheme }}
      - name: Keep the screenshots of what failed
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: smoke-failures-${{ matrix.scheme }}
          path: app/preview/failures/
          retention-days: 14
