name: Apple client

# The native iPhone and iPad app in apple-client/: compiled and tested on a
# Mac runner whenever it changes, since it's written away from a Mac. The
# package is also built and tested for macOS there, where swift test runs.
# The payee logos are the computer's own (web/src/finances and its colours
# in web/dist/style.css), so a change there runs the quick check below too;
# the Mac job runs only when the app itself changed.
on:
  push:
    branches: [main]
    paths:
      - "apple-client/**"
      - ".github/workflows/apple-client.yml"
      - "mobile/**"
      - "internal/finance/**"
      - "web/src/finances/logos.ts"
      - "web/src/finances/Mark.tsx"
      - "web/src/finances/payees.ts"
      - "web/src/finances/hues.ts"
      - "web/src/finances/importData.ts"
      - "web/dist/style.css"
  pull_request:
    paths:
      - "apple-client/**"
      - ".github/workflows/apple-client.yml"
      - "mobile/**"
      - "internal/finance/**"
      - "web/src/finances/logos.ts"
      - "web/src/finances/Mark.tsx"
      - "web/src/finances/payees.ts"
      - "web/src/finances/hues.ts"
      - "web/src/finances/importData.ts"
      - "web/dist/style.css"

permissions:
  contents: read

concurrency:
  group: apple-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared/Resources/PayeeLogos.json and Tests/Resources/PayeeVectors.json are
  # made from the computer's own logos and matching by
  # scripts/make-payee-logos.mjs; this fails when they're out of date. It
  # also says whether the app changed, so the Mac job is skipped for a
  # change on the computer's side alone.
  payee-logos:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      app: ${{ steps.changed.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did the app change
        id: changed
        # A pull request is checked out as its merge into the base, whose
        # first parent is the base; a push says the commit it came after.
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then BASE="$(git rev-parse HEAD^1 2>/dev/null || true)"; else BASE="$BEFORE"; fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || git diff --name-only "$BASE" HEAD | grep -qE '^(apple-client/|mobile/|internal/finance/|\.github/workflows/apple-client\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"; echo "The app changed"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"; echo "Only the computer's side changed"
          fi
      - name: The payee logos match the computer's
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node apple-client/scripts/make-payee-logos.mjs --check

  build-and-test:
    needs: payee-logos
    if: ${{ !cancelled() && needs.payee-logos.outputs.app == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apple-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The newest released Xcode on the runner: the sources need Swift 6 and
      # SwiftUI's macros, which only full Xcode has.
      - name: Pick the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
          # build <name> <xcodebuild args>: the whole log is kept, and on a
          # failure every error in it is printed, wherever it came.
          cat > "$RUNNER_TEMP/build.sh" <<'SH'
          build() {
            local name="$1"; shift
            local log="$RUNNER_TEMP/$name.log"
            if xcodebuild "$@" CODE_SIGNING_ALLOWED=NO build >"$log" 2>&1; then
              tail -3 "$log"
            else
              echo "::group::Errors"; grep -E "error:|fatal error" "$log" | sort -u | head -100; echo "::endgroup::"
              tail -30 "$log"
              return 1
            fi
          }
          SH
          echo "BASH_ENV=$RUNNER_TEMP/build.sh" >> "$GITHUB_ENV"

      # The computer's own Finances code for the phone (FinanceProjection),
      # bound with gomobile at the Makefile's version into Frameworks/.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: HomelabFinance.xcframework
        run: |
          v="$(sed -n 's/^MOBILE_VERSION := //p' ../Makefile)"
          go install "golang.org/x/mobile/cmd/gomobile@$v" "golang.org/x/mobile/cmd/gobind@$v"
          export PATH="$(go env GOPATH)/bin:$PATH"
          (cd .. && make phone-finance-framework)
          echo "HOMELAB_FINANCE_FRAMEWORK=1" >> "$GITHUB_ENV"

      - name: Build the package for macOS (Swift 6 mode)
        run: |
          set -o pipefail
          swift build 2>&1 | tee "$RUNNER_TEMP/swift-build.log"

      - name: Run the tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log"

      # The iOS-only parts (the QR scanner, haptics, keyboard types) compile
      # only for iOS.
      - name: Build the package for iOS
        run: |
          build package-ios -scheme HomelabClient -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/package-ios"

      # The app as people build it: the project make-xcode-project.sh
      # writes (Info.plist keys, entitlements, the asset catalog and icon),
      # without signing.
      - name: Make the Xcode project
        env:
          HOMELAB_XCODE_DIR: ${{ runner.temp }}/xcode
          HOMELAB_NO_OPEN: "1"
        run: |
          brew install xcodegen
          ./scripts/make-xcode-project.sh com.example

      - name: Build the iPhone app
        run: |
          build iphone-app -project "$RUNNER_TEMP/xcode/HomelabClient.xcodeproj" -scheme HomelabClient-iOS \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/app"

      # The same app with the Home Screen widget (HOMELAB_WIDGET=1), which
      # people build only when they ask for it.
      - name: Make the Xcode project with the widget
        env:
          HOMELAB_XCODE_DIR: ${{ runner.temp }}/xcode-widget
          HOMELAB_NO_OPEN: "1"
          HOMELAB_WIDGET: "1"
        run: ./scripts/make-xcode-project.sh com.example

      - name: Build the iPhone app with the widget
        run: |
          build iphone-widget -project "$RUNNER_TEMP/xcode-widget/HomelabClient.xcodeproj" -scheme HomelabClient-iOS \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/app-widget"

      # The app as it is built the day the owner signs (HOMELAB_SIGNED=1:
      # the widget, push, and the code under #if HOMELAB_SIGNED), so the
      # signed path can't stop compiling unseen.
      - name: Make the Xcode project signed
        env:
          HOMELAB_XCODE_DIR: ${{ runner.temp }}/xcode-signed
          HOMELAB_NO_OPEN: "1"
          HOMELAB_SIGNED: "1"
        run: ./scripts/make-xcode-project.sh com.example ABCDE12345

      - name: Build the iPhone app signed
        run: |
          build iphone-signed -project "$RUNNER_TEMP/xcode-signed/HomelabClient.xcodeproj" -scheme HomelabClient-iOS \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/app-signed"

      # The scripts people run on their Mac: each parses, and each does what
      # it says against stand-ins for Xcode, the iPhone and the homelab.
      - name: Scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Scripts behave
        run: ./scripts/test-scripts.sh

      # Every compiler warning from the builds above, once each, at the end
      # of the log where it's easy to find. The app builds without any, so a
      # new one fails the job: in Swift 6 most are data races waiting to be
      # errors. Xcode's App Intents tool noting the app has none isn't one.
      - name: Warnings
        if: always()
        run: |
          cat "$RUNNER_TEMP"/*.log 2>/dev/null | grep -E "warning:" | grep -v "^ld: warning" \
            | grep -v "appintentsmetadataprocessor" \
            | sed -E 's#^.*/apple-client/##' | sort -u > "$RUNNER_TEMP/warnings.txt" || true
          count="$(wc -l < "$RUNNER_TEMP/warnings.txt" | tr -d ' ')"
          echo "$count unique warnings"
          head -150 "$RUNNER_TEMP/warnings.txt"
          [ "$count" = 0 ] || { echo "::error::$count compiler warning(s) in the Apple client; fix them (see above)"; exit 1; }

  # The iPhone app in the simulator, each screen in light and dark, as
  # pictures to look at (the iphone-screenshots artifact): built with the
  # SCREENSHOTS flag, which pairs it with the sample homelab in
  # apple-client/Screenshots/data.json (Shared/Screenshots); the app people
  # run is built without it. A build error fails the job; a picture that
  # doesn't come is only missing from the set.
  screenshots:
    needs: payee-logos
    if: ${{ !cancelled() && needs.payee-logos.outputs.app == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apple-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Make the Xcode project
        env:
          HOMELAB_XCODE_DIR: ${{ runner.temp }}/xcode
          HOMELAB_NO_OPEN: "1"
        run: |
          brew install xcodegen
          ./scripts/make-xcode-project.sh com.example

      - name: Pick an iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          UDID="$(/usr/bin/python3 -I - "$RUNNER_TEMP/devices.json" <<'PY'
          import json, re, sys
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          devices = [(version(r), d) for r, ds in json.load(open(sys.argv[1]))["devices"].items() if "iOS" in r for d in ds if d["name"].startswith("iPhone")]
          def rank(item):
              v, d = item
              m = re.match(r"iPhone (\d+) Pro$", d["name"])
              return (v, 1 if m else 0, int(m.group(1)) if m else 0)
          v, best = max(devices, key=rank)
          print(best["udid"])
          print(best["name"], v, file=sys.stderr)
          PY
          )"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build the screenshots app for the simulator
        run: |
          set -o pipefail
          if ! xcodebuild -project "$RUNNER_TEMP/xcode/HomelabClient.xcodeproj" -scheme HomelabClient-iOS \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/shots" \
              CODE_SIGNING_ALLOWED=NO 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) SCREENSHOTS' build > "$RUNNER_TEMP/shots.log" 2>&1; then
            grep -E "error:|fatal error" "$RUNNER_TEMP/shots.log" | sort -u | head -100
            tail -30 "$RUNNER_TEMP/shots.log"
            exit 1
          fi
          tail -3 "$RUNNER_TEMP/shots.log"
          warnings="$(grep -E "warning:" "$RUNNER_TEMP/shots.log" | grep -v "^ld: warning" | grep -v appintentsmetadataprocessor | sed -E 's#^.*/apple-client/##' | sort -u || true)"
          if [ -n "$warnings" ]; then echo "$warnings"; echo "::error::compiler warnings in the screenshots build"; exit 1; fi

      - name: Take the pictures
        run: |
          APP="$(ls -d "$RUNNER_TEMP"/shots/Build/Products/Debug-iphonesimulator/*.app | grep -v Widget | head -1)"
          BID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          xcrun simctl install "$UDID" "$APP"
          DATA="$(xcrun simctl get_app_container "$UDID" "$BID" data)"
          mkdir -p "$DATA/Documents"
          cp Screenshots/data.json "$DATA/Documents/screenshot-data.json"
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          mkdir -p "$RUNNER_TEMP/pictures"
          shots="status backups finances spending inbox loading transactions transaction budgets bills recurring cashflow review accounts investments goals setup settings settings-all lock app"
          for look in light dark; do
            xcrun simctl ui "$UDID" appearance "$look"
            for shot in $shots; do
              xcrun simctl launch --terminate-running-process "$UDID" "$BID" -shot "$shot" > /dev/null || { echo "couldn't open $shot"; continue; }
              sleep 7
              file="$RUNNER_TEMP/pictures/$look-$shot.png"
              xcrun simctl io "$UDID" screenshot "$file" > /dev/null 2>&1 || { echo "no picture of $look-$shot"; continue; }
              # A plain white or black screen (the app still opening) is a small file: wait, and take it again.
              if [ "$(stat -f %z "$file")" -lt 120000 ]; then
                sleep 6
                xcrun simctl io "$UDID" screenshot "$file" > /dev/null 2>&1 || true
              fi
              echo "$look-$shot"
            done
          done
          # The largest accessibility text size, for what might cut off.
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large || true
          for shot in status finances transactions spending; do
            xcrun simctl launch --terminate-running-process "$UDID" "$BID" -shot "$shot" > /dev/null || continue
            sleep 8
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/pictures/large-$shot.png" > /dev/null 2>&1 && echo "large-$shot" || true
          done
          xcrun simctl ui "$UDID" content_size large || true
          # Finances as it opens, amounts hidden.
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl launch --terminate-running-process "$UDID" "$BID" -shot finances -hidden > /dev/null && sleep 7 \
            && xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/pictures/light-finances-hidden.png" > /dev/null 2>&1 || true

      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-screenshots
          path: ${{ runner.temp }}/pictures/
          retention-days: 14
          if-no-files-found: warn
