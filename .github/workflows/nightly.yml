name: Nightly

# A homelab's life against a real Docker Engine (test/realdocker): install
# a small preset, data in each app through its own API, the nightly
# backup, the watchdog's cases, an update and its rollback, then moved
# out, wiped, moved in, and the data read back. Every night, by hand, and
# on pull requests that change the catalog or the run itself, so a new
# app is shown to start and answer before it is merged.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      catalog:
        description: "The catalog's shares to start (0-6, or all)"
        default: all
  pull_request:
    paths:
      - compose.yaml
      - compose/**
      - stacks/**
      - dockerfiles/**
      - .env.example
      - test/realdocker/**
      - .github/workflows/nightly.yml

permissions:
  contents: read

jobs:
  real-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Room for every app's image (Paperless-AI's alone is 13 GB
      # unpacked): the runner's toolchains this run does not use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - name: Docker Engine and Compose
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
      # For the app's page against this homelab (app/preview/real.mjs).
      - name: Playwright and Chromium
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
      # How long Status took in the last run that passed; this run fails
      # at more than twice that, and keeps its own for the next.
      - name: The last good run's Status time
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/status-timing
          key: status-timing-${{ github.run_id }}
          restore-keys: status-timing-
      - name: A homelab's life, against real Docker
        env:
          REALDOCKER_ARTIFACTS: ${{ runner.temp }}/realdocker
          REALDOCKER_TIMING: ${{ runner.temp }}/status-timing/status-timing.json
        run: go test -tags realdocker -v -timeout 55m ./test/realdocker
      - name: This run's Status time, for the next run
        if: success()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/status-timing
          key: status-timing-${{ github.run_id }}
      - name: Keep the diagnostics report and the jobs' logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realdocker-report
          path: ${{ runner.temp }}/realdocker/
          retention-days: 14
      # A failed night opens an issue with the report's end in it (the
      # report has every secret replaced; these are a throwaway homelab's).
      - name: Open an issue for a failed night
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$(ls -t "$RUNNER_TEMP"/realdocker/report-*.txt 2>/dev/null | head -n 1)"
          {
            echo "The nightly run against real Docker failed: $RUN_URL"
            echo
            echo "The run's \`homelab report\` and the jobs' logs are the run's *realdocker-report* artifact."
            if [ -n "$report" ]; then
              echo
              echo "<details><summary>The report's last 150 lines</summary>"
              echo
              echo '```'
              tail -n 150 "$report"
              echo '```'
              echo "</details>"
            fi
          } > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly run failed on $(date -u +%Y-%m-%d)" --body-file issue.md

  # Each catalog app the life run does not cover, started alone and its
  # page answering (TestTheCatalogStarts): a seventh of them each night, by
  # the day of the week, so every app starts at least once a week; all
  # seven shares when run by hand.
  catalog-plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      shares: ${{ steps.plan.outputs.shares }}
    steps:
      - id: plan
        env:
          WANT: ${{ inputs.catalog }}
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            echo "shares=[$(( $(date -u +%u) % 7 ))]" >> "$GITHUB_OUTPUT"
          elif [ "${WANT:-all}" = all ]; then
            echo "shares=[0,1,2,3,4,5,6]" >> "$GITHUB_OUTPUT"
          else
            case "$WANT" in [0-6]) echo "shares=[$WANT]" >> "$GITHUB_OUTPUT";; *) echo "catalog: want 0-6 or all, not $WANT"; exit 1;; esac
          fi

  catalog:
    needs: catalog-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        share: ${{ fromJSON(needs.catalog-plan.outputs.shares) }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: The catalog's share ${{ matrix.share }} of 7, each app started alone
        env:
          REALDOCKER_CATALOG: ${{ matrix.share }}/7
          REALDOCKER_ARTIFACTS: ${{ runner.temp }}/realdocker
        run: go test -tags realdocker -v -timeout 115m -run TestTheCatalogStarts ./test/realdocker
      - name: Keep the diagnostics reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-${{ matrix.share }}-report
          path: ${{ runner.temp }}/realdocker/
          retention-days: 14
      - name: Open an issue for a failed night
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Catalog share ${{ matrix.share }} failed to start on $(date -u +%Y-%m-%d)" \
            --body "An app in the catalog's share ${{ matrix.share }} of 7 did not start or answer against real Docker: $RUN_URL (its report is the catalog-${{ matrix.share }}-report artifact)."

  # homelab domain setup against the real Nginx Proxy Manager and AdGuard
  # Home (TestTheDomainThroughTheProxy, ISSUE-0004): each night and by hand,
  # on a homelab of its own, beside the life run.
  domain:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The domain through the proxy, against real Docker
        env:
          REALDOCKER_DOMAIN: "1"
          REALDOCKER_ARTIFACTS: ${{ runner.temp }}/realdocker
        run: go test -tags realdocker -v -timeout 40m -run TestTheDomainThroughTheProxy ./test/realdocker
      - name: Keep the diagnostics report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: domain-report
          path: ${{ runner.temp }}/realdocker/
          retention-days: 14
