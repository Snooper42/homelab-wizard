name: Nightly

# A homelab's life against a real Docker Engine (test/realdocker): install
# a small preset, data in each app through its own API, the nightly
# backup, the watchdog's cases, an update and its rollback, then moved
# out, wiped, moved in, and the data read back. Every night, by hand, and
# on pull requests that change the catalog or the run itself, so a new
# app is shown to start and answer before it is merged.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - compose.yaml
      - compose/**
      - stacks/**
      - dockerfiles/**
      - .env.example
      - test/realdocker/**
      - .github/workflows/nightly.yml

permissions:
  contents: read

jobs:
  real-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Room for every app's image (Paperless-AI's alone is 13 GB
      # unpacked): the runner's toolchains this run does not use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - name: Docker Engine and Compose
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
      - name: A homelab's life, against real Docker
        env:
          REALDOCKER_ARTIFACTS: ${{ runner.temp }}/realdocker
        run: go test -tags realdocker -v -timeout 55m ./test/realdocker
      - name: Keep the diagnostics report and the jobs' logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realdocker-report
          path: ${{ runner.temp }}/realdocker/
          retention-days: 14
      # A failed night opens an issue with the report's end in it (the
      # report has every secret replaced; these are a throwaway homelab's).
      - name: Open an issue for a failed night
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$(ls -t "$RUNNER_TEMP"/realdocker/report-*.txt 2>/dev/null | head -n 1)"
          {
            echo "The nightly run against real Docker failed: $RUN_URL"
            echo
            echo "The run's \`homelab report\` and the jobs' logs are the run's *realdocker-report* artifact."
            if [ -n "$report" ]; then
              echo
              echo "<details><summary>The report's last 150 lines</summary>"
              echo
              echo '```'
              tail -n 150 "$report"
              echo '```'
              echo "</details>"
            fi
          } > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly run failed on $(date -u +%Y-%m-%d)" --body-file issue.md
