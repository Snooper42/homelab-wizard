# Media automation: indexers, the *arr apps, requests, and downloads.
#
# Its own Compose project, homelab_media_automation, run from the homelab folder
# (paths resolve from there). See compose.yaml for the rules (baseline,
# optional, x-homelab).

name: homelab_media_automation

x-service: &service
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

networks:
  default:
    name: homelab
    external: true

services:
  prowlarr:
    <<: *service
    image: lscr.io/linuxserver/prowlarr:latest
    profiles: [optional]
    environment: &linuxserver
      PUID: ${PUID:-501}
      PGID: ${PGID:-20}
      TZ: ${TZ:-UTC}
    ports:
      - ${BIND_IP:-127.0.0.1}:${PROWLARR_PORT:-9696}:9696
    volumes:
      - ${APPDATA_ROOT:-./data/appdata}/prowlarr:/config
    x-homelab:
      goes_with:
        sonarr: "Gives Sonarr its search sites in one place, shared with Radarr."
        radarr: "Gives Radarr its search sites in one place, shared with Sonarr."
      memory: 200
      name: Prowlarr
      login: [ARR_USER, ARR_PASSWORD]
      keyfile: config.xml
      category: media-automation
      description: Indexer manager for the *arr apps
      subdomain: prowlarr
      web: 9696

  sonarr:
    <<: *service
    image: lscr.io/linuxserver/sonarr:latest
    profiles: [optional]
    environment: *linuxserver
    ports:
      - ${BIND_IP:-127.0.0.1}:${SONARR_PORT:-8989}:8989
    volumes:
      - ${APPDATA_ROOT:-./data/appdata}/sonarr:/config
      - type: bind
        source: ${MEDIA_ROOT:-/Volumes/Media}/tv
        target: /tv
        bind:
          create_host_path: false
      - type: bind
        source: ${DOWNLOADS_ROOT:-/Volumes/Media/downloads}
        target: /downloads
        bind:
          create_host_path: false
    x-homelab:
      memory: 250
      name: Sonarr
      login: [ARR_USER, ARR_PASSWORD]
      keyfile: config.xml
      category: media-automation
      description: TV show automation
      subdomain: sonarr
      web: 8989

  radarr:
    <<: *service
    image: lscr.io/linuxserver/radarr:latest
    profiles: [optional]
    environment: *linuxserver
    ports:
      - ${BIND_IP:-127.0.0.1}:${RADARR_PORT:-7878}:7878
    volumes:
      - ${APPDATA_ROOT:-./data/appdata}/radarr:/config
      - type: bind
        source: ${MEDIA_ROOT:-/Volumes/Media}/movies
        target: /movies
        bind:
          create_host_path: false
      - type: bind
        source: ${DOWNLOADS_ROOT:-/Volumes/Media/downloads}
        target: /downloads
        bind:
          create_host_path: false
    x-homelab:
      memory: 250
      name: Radarr
      login: [ARR_USER, ARR_PASSWORD]
      keyfile: config.xml
      category: media-automation
      description: Movie automation
      subdomain: radarr
      web: 7878

  lidarr:
    <<: *service
    image: lscr.io/linuxserver/lidarr:latest
    profiles: [optional]
    environment: *linuxserver
    ports:
      - ${BIND_IP:-127.0.0.1}:${LIDARR_PORT:-8686}:8686
    volumes:
      - ${APPDATA_ROOT:-./data/appdata}/lidarr:/config
      - type: bind
        source: ${MEDIA_ROOT:-/Volumes/Media}/music
        target: /music
        bind:
          create_host_path: false
      - type: bind
        source: ${DOWNLOADS_ROOT:-/Volumes/Media/downloads}
        target: /downloads
        bind:
          create_host_path: false
    x-homelab:
      memory: 250
      name: Lidarr
      login: [ARR_USER, ARR_PASSWORD]
      keyfile: config.xml
      category: media-automation
      description: Music automation
      subdomain: lidarr
      web: 8686

  bazarr:
    <<: *service
    image: lscr.io/linuxserver/bazarr:latest
    profiles: [optional]
    environment: *linuxserver
    ports:
      - ${BIND_IP:-127.0.0.1}:${BAZARR_PORT:-6767}:6767
    volumes:
      - ${APPDATA_ROOT:-./data/appdata}/bazarr:/config
      - type: bind
        source: ${MEDIA_ROOT:-/Volumes/Media}/tv
        target: /tv
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_ROOT:-/Volumes/Media}/movies
        target: /movies
        bind:
          create_host_path: false
    x-homelab:
      goes_with:
        sonarr: "Fetches subtitles for the shows Sonarr brings in."
        radarr: "Fetches subtitles for the films Radarr brings in."
      memory: 200
      name: Bazarr
      keyfile: config/config.yaml
      category: media-automation
      description: Subtitles for Sonarr and Radarr
      subdomain: bazarr
      web: 6767

  tdarr:
    <<: *service
    image: docker.io/haveagitgat/tdarr:latest
    profiles: [optional]
    environment:
      <<: *linuxserver
      # The server, with a node of its own in the same container.
      serverIP: 0.0.0.0
      serverPort: 8266
      webUIPort: 8265
      internalNode: "true"
      inContainer: "true"
      nodeName: homelab
      # Tidy Up's key to Tdarr's API: Tdarr 3 takes no sign-up, so the
      # homelab makes the key and Tdarr takes it as its own at start.
      seededApiKey: ${TDARR_API_KEY:-}
    ports:
      - ${BIND_IP:-127.0.0.1}:${TDARR_PORT:-8265}:8265
    volumes:
      - ${APPDATA_ROOT:-./data/appdata}/tdarr/server:/app/server
      - ${APPDATA_ROOT:-./data/appdata}/tdarr/configs:/app/configs
      - ${APPDATA_ROOT:-./data/appdata}/tdarr/logs:/app/logs
      - type: bind
        source: ${MEDIA_ROOT:-/Volumes/Media}/tv
        target: /media/tv
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_ROOT:-/Volumes/Media}/movies
        target: /media/movies
        bind:
          create_host_path: false
      # Files half-made while it works, as large as the films: on the
      # media drive, beside them.
      - type: bind
        source: ${MEDIA_ROOT:-/Volumes/Media}/tdarr-cache
        target: /temp
        bind:
          create_host_path: false
    x-homelab:
      goes_with:
        jellyfin: "Shrinks the films and shows Jellyfin plays, so the drive holds more."
        jellyfin-container: "Shrinks the films and shows Jellyfin plays, so the drive holds more."
      memory: 1000
      dump: sqlite:/app/server/Tdarr/DB2/SQL/database.db
      name: Tdarr
      login: [TDARR_USER, TDARR_PASSWORD]
      keys: [TDARR_API_KEY]
      category: media-automation
      description: Shrinks the media library by converting films and shows to a smaller format
      subdomain: tdarr
      web: 8265
      admin: true
      warning: "heavy: converting a film keeps the processor busy for as long as the film runs or longer; it does nothing until you add a library and give its node workers, and it is best kept to the night (its note says how)"

  flaresolverr:
    <<: *service
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: [optional]
    environment:
      TZ: ${TZ:-UTC}
    x-homelab:
      memory: 400
      name: FlareSolverr
      category: media-automation
      description: Solves Cloudflare challenges for Prowlarr's indexers (http://flaresolverr:8191)
      web: false

  seerr:
    <<: *service
    image: ghcr.io/seerr-team/seerr:latest
    profiles: [optional]
    init: true
    # The image runs as a user of its own (uid 1000); the host user owns
    # the data folders, so it runs as that user instead (or, on Linux under
    # any other uid, it cannot write them and stops at every start).
    user: ${PUID:-501}:${PGID:-20}
    environment:
      TZ: ${TZ:-UTC}
    # Jellyfin runs on this machine (ADR-0010): Seerr signs in to it there.
    extra_hosts:
      - host.docker.internal:${HOST_GATEWAY:-host-gateway}
    ports:
      - ${BIND_IP:-127.0.0.1}:${SEERR_PORT:-5055}:5055
    volumes:
      - ${APPDATA_ROOT:-./data/appdata}/seerr:/app/config
    x-homelab:
      goes_with:
        jellyfin: "Lets the household ask for films and shows, which Sonarr and Radarr then fetch."
        jellyfin-container: "Lets the household ask for films and shows, which Sonarr and Radarr then fetch."
      memory: 250
      dump: sqlite:/app/config/db/db.sqlite3
      name: Seerr
      keyfile: settings.json
      category: media-automation
      description: Media requests for Jellyfin (successor to Overseerr and Jellyseerr)
      subdomain: seerr
      web: 5055
      aliases: [overseerr, jellyseerr]

  lazylibrarian:
    <<: *service
    image: lscr.io/linuxserver/lazylibrarian:latest
    profiles: [optional]
    environment: *linuxserver
    ports:
      - ${BIND_IP:-127.0.0.1}:${LAZYLIBRARIAN_PORT:-5299}:5299
    volumes:
      - ${APPDATA_ROOT:-./data/appdata}/lazylibrarian:/config
      - type: bind
        source: ${MEDIA_ROOT:-/Volumes/Media}/Books
        target: /books
        bind:
          create_host_path: false
      - type: bind
        source: ${DOWNLOADS_ROOT:-/Volumes/Media/downloads}
        target: /downloads
        bind:
          create_host_path: false
    x-homelab:
      goes_with:
        calibre-web: "Finds the e-books and audiobooks you want, for the library Calibre-Web reads."
      memory: 150
      name: LazyLibrarian
      category: media-automation
      description: E-book and audiobook automation
      subdomain: lazylibrarian
      web: 5299

  qbittorrent:
    <<: *service
    image: lscr.io/linuxserver/qbittorrent:latest
    # Background work: it yields the CPU to the apps people are using
    # (shares count only while the CPU is busy; idle, it gets it all).
    cpu_shares: 256
    profiles: [optional]
    network_mode: service:gluetun
    environment:
      PUID: ${PUID:-501}
      PGID: ${PGID:-20}
      TZ: ${TZ:-UTC}
      WEBUI_PORT: "8082"
    volumes:
      - ${APPDATA_ROOT:-./data/appdata}/qbittorrent:/config
      - type: bind
        source: ${DOWNLOADS_ROOT:-/Volumes/Media/downloads}
        target: /downloads
        bind:
          create_host_path: false
    depends_on:
      gluetun: { condition: service_healthy }
    x-homelab:
      memory: 200
      name: qBittorrent
      login: [QBITTORRENT_USER, QBITTORRENT_PASSWORD]
      category: media-automation
      description: Torrent client; it has no network except the ProtonVPN tunnel
      subdomain: qbittorrent
      web: 8082
      proxy_host: gluetun

  sabnzbd:
    <<: *service
    image: lscr.io/linuxserver/sabnzbd:latest
    # Background work, like qBittorrent: unpacking yields the CPU.
    cpu_shares: 256
    profiles: [optional]
    # Inside the VPN like qBittorrent (the owner, Nov 20: "just to be extra
    # secure"): the Usenet server sees ProtonVPN's address, and nothing leaves
    # if the VPN is down. The apps reach it at gluetun:8080.
    network_mode: service:gluetun
    environment: *linuxserver
    volumes:
      - ${APPDATA_ROOT:-./data/appdata}/sabnzbd:/config
      - type: bind
        source: ${DOWNLOADS_ROOT:-/Volumes/Media/downloads}
        target: /downloads
        bind:
          create_host_path: false
    depends_on:
      gluetun: { condition: service_healthy }
    x-homelab:
      goes_with:
        sonarr: "Downloads from Usenet, preferred over torrents, so a release nobody shares doesn't hold things up."
        radarr: "Downloads from Usenet, preferred over torrents, so a release nobody shares doesn't hold things up."
      memory: 250
      name: SABnzbd
      login: [ARR_USER, ARR_PASSWORD]
      keyfile: sabnzbd.ini
      category: media-automation
      description: Usenet downloader, preferred over torrents; it has no network except the ProtonVPN tunnel
      subdomain: sabnzbd
      web: 8080
      proxy_host: gluetun

  gluetun:
    <<: *service
    image: qmcgaw/gluetun:latest
    profiles: [optional]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      TZ: ${TZ:-UTC}
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${PROTONVPN_WIREGUARD_PRIVATE_KEY}
      SERVER_COUNTRIES: ${PROTONVPN_SERVER_COUNTRIES:-}
      PORT_FORWARD_ONLY: "on"
      VPN_PORT_FORWARDING: "on"
      # Its control server stops the VPN and gives its address: on its own
      # loopback, which qBittorrent shares, never the shared network.
      HTTP_CONTROL_SERVER_ADDRESS: 127.0.0.1:8000
      # The forwarded port goes into qBittorrent by itself each time the VPN
      # connects (it changes on every reconnect). The call stays on this
      # loopback, which only qBittorrent shares, and qBittorrent lets it in
      # without its login (bypass_local_auth, which Connect apps sets). It
      # may still be starting, so the call is tried for up to five minutes.
      # When the VPN drops, qBittorrent is put on no port and no network
      # until it's back (Gluetun's wiki: qBittorrent misses a reconnect
      # otherwise). 8082 is qBittorrent's own WEBUI_PORT, not QBITTORRENT_PORT.
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'i=0; until wget -q -O /dev/null --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8082/api/v2/app/setPreferences; do i=$$((i+1)); [ $$i -ge 60 ] && exit 1; sleep 5; done'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -q -O /dev/null --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8082/api/v2/app/setPreferences'
      # Kept in its folder so Connect apps can read the port too.
      VPN_PORT_FORWARDING_STATUS_FILE: /gluetun/forwarded_port
      # The address it reached the internet from, asked through the tunnel on
      # each connect and emptied when it stops: Setup's "Downloads are
      # private" reads it, so the homelab asks no outside service itself.
      PUBLICIP_FILE: /gluetun/ip
    ports:
      # qBittorrent shares this container's network, so its UI is published here.
      - ${BIND_IP:-127.0.0.1}:${QBITTORRENT_PORT:-8082}:8082
      # SABnzbd's too (it listens on 8080 inside).
      - ${BIND_IP:-127.0.0.1}:${SABNZBD_PORT:-8091}:8080
    volumes:
      - ${APPDATA_ROOT:-./data/appdata}/gluetun:/gluetun
    x-homelab:
      releases: qdm12/gluetun
      name: Gluetun
      category: media-automation
      description: ProtonVPN tunnel that qBittorrent's and SABnzbd's traffic is forced through
      web: false
      requires: [PROTONVPN_WIREGUARD_PRIVATE_KEY]
