# Media: music, audiobooks, books, and comics (Jellyfin runs natively).
#
# Its own Compose project, homelab_media, run from the homelab folder
# (paths resolve from there). See compose.yaml for the rules (baseline,
# optional, x-homelab).

name: homelab_media

x-service: &service
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

networks:
  default:
    name: homelab
    external: true

services:
  navidrome:
    <<: *service
    image: deluan/navidrome:latest
    environment:
      TZ: ${TZ:-UTC}
      # Same path as on the Mac so .m3u playlists with absolute paths work;
      # on Windows /music (NAVIDROME_MUSIC_PATH), since C:\ cannot be a
      # container path.
      ND_MUSICFOLDER: ${NAVIDROME_MUSIC_PATH:-${MEDIA_ROOT:-/Volumes/Media}/music}
      ND_SCANSCHEDULE: 1h
      ND_AUTOIMPORTPLAYLISTS: "true"
      ND_LOGLEVEL: warn
    ports:
      - ${BIND_IP:-127.0.0.1}:${NAVIDROME_PORT:-4533}:4533
    volumes:
      - ./data/appdata/navidrome:/data
      - ${MEDIA_ROOT:-/Volumes/Media}/music:${NAVIDROME_MUSIC_PATH:-${MEDIA_ROOT:-/Volumes/Media}/music}:ro
    x-homelab:
      releases: navidrome/navidrome
      phone: Amperfy or play:Sub on iPhone, Symfonium on Android
      url: NAVIDROME_URL
      dump: sqlite:/data/navidrome.db
      name: Navidrome
      category: media
      description: Music server for the Subsonic apps and Feishin
      subdomain: navidrome
      web: 4533
      public: true

  feishin:
    <<: *service
    image: ghcr.io/jeffvli/feishin:latest
    environment:
      SERVER_NAME: Navidrome
      SERVER_TYPE: navidrome
      SERVER_URL: ${NAVIDROME_URL:-https://navidrome.${HOMELAB_DOMAIN:-example.com}}
      SERVER_LOCK: "false"
      ANALYTICS_DISABLED: "true"
    ports:
      - ${BIND_IP:-127.0.0.1}:${FEISHIN_PORT:-9180}:9180
    depends_on: [navidrome]
    x-homelab:
      name: Feishin
      category: media
      description: Web music player for Navidrome
      subdomain: music
      web: 9180
      public: true

  audiobookshelf:
    <<: *service
    image: ghcr.io/advplyr/audiobookshelf:latest
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - ${BIND_IP:-127.0.0.1}:${AUDIOBOOKSHELF_PORT:-13378}:80
    volumes:
      - ./data/appdata/audiobookshelf/config:/config
      - ./data/appdata/audiobookshelf/metadata:/metadata
      - ${MEDIA_ROOT:-/Volumes/Media}/audiobooks:/audiobooks
      - ${MEDIA_ROOT:-/Volumes/Media}/podcasts:/podcasts
    x-homelab:
      memory: 150
      phone: Audiobookshelf
      dump: sqlite:/config/absdatabase.sqlite
      name: Audiobookshelf
      category: media
      description: Audiobooks and podcasts
      subdomain: audiobooks
      web: 80
      public: true

  calibre-web:
    <<: *service
    image: lscr.io/linuxserver/calibre-web:latest
    environment:
      PUID: ${PUID:-501}
      PGID: ${PGID:-20}
      TZ: ${TZ:-UTC}
    ports:
      - ${BIND_IP:-127.0.0.1}:${CALIBRE_WEB_PORT:-8083}:8083
    volumes:
      - ./data/appdata/calibre-web:/config
      - ${MEDIA_ROOT:-/Volumes/Media}/Books:/books
    x-homelab:
      memory: 150
      dump: sqlite:/config/app.db
      name: Calibre-Web
      category: media
      description: E-book library and reader for the Calibre library
      subdomain: books
      web: 8083
      public: true

  komga:
    <<: *service
    image: gotson/komga:latest
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - ${BIND_IP:-127.0.0.1}:${KOMGA_PORT:-25600}:25600
    volumes:
      - ./data/appdata/komga:/config
      - ${MEDIA_ROOT:-/Volumes/Media}/Books:/books:ro
      - ${MEDIA_ROOT:-/Volumes/Media}/comics:/comics:ro
    x-homelab:
      memory: 400
      releases: gotson/komga
      dump: sqlite:/config/database.sqlite
      name: Komga
      category: media
      description: Comics and manga reader
      subdomain: comics
      web: 25600
      public: true

  kavita:
    <<: *service
    image: jvmilazz0/kavita:latest
    profiles: [optional]
    environment:
      TZ: ${TZ:-UTC}
    ports:
      # Host port 5000 belongs to macOS AirPlay Receiver.
      - ${BIND_IP:-127.0.0.1}:${KAVITA_PORT:-5500}:5000
    volumes:
      - ./data/appdata/kavita:/kavita/config
      - ${MEDIA_ROOT:-/Volumes/Media}/Books:/books:ro
      - ${MEDIA_ROOT:-/Volumes/Media}/comics:/comics:ro
    x-homelab:
      memory: 200
      releases: Kareadita/Kavita
      dump: sqlite:/kavita/config/kavita.db
      name: Kavita
      category: media
      description: Books, comics, and manga reader
      subdomain: kavita
      web: 5000

  # Jellyfin in a container, for SteamOS: its system takes no packages, so
  # the native Jellyfin (compose.yaml's x-homelab-native) has no install
  # there, and this one answers to its name (catalog.ForSteamOS). Elsewhere
  # it is an alternative to the native app, which can use the graphics.
  # Its library is in JELLYFIN_DATA_DIR, as the native app's is, so the
  # weekly Homelab Jellyfin backup keeps it. Transcoding is on the
  # processor; AMD graphics are added by hand (Jellyfin's note).
  jellyfin-container:
    <<: *service
    image: jellyfin/jellyfin:latest
    profiles: [optional]
    user: ${PUID:-501}:${PGID:-20}
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - ${BIND_IP:-127.0.0.1}:${JELLYFIN_PORT:-8096}:8096
    volumes:
      - ${JELLYFIN_DATA_DIR:-~/.local/share/jellyfin}:/config
      - ${JELLYFIN_DATA_DIR:-~/.local/share/jellyfin}/cache:/cache
      - ${MEDIA_ROOT:-/Volumes/Media}/movies:/media/movies:ro
      - ${MEDIA_ROOT:-/Volumes/Media}/tv:/media/tv:ro
    x-homelab:
      memory: 1000
      releases: jellyfin/jellyfin
      phone: Jellyfin, or Swiftfin on iPhone
      name: Jellyfin in a container
      category: media
      description: Movies and TV in a container, the Jellyfin for SteamOS; elsewhere the native Jellyfin can use the graphics for transcoding
      subdomain: jellyfin
      web: 8096
      conflicts: [jellyfin]
