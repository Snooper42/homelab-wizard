<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Updates, one line</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
.b{display:inline-flex;align-items:center;height:26px;padding:0 12px;border:0;border-radius:7px;background:var(--panel);color:var(--text);box-shadow:0 0 0 .5px var(--line-strong),0 1px 1px var(--lift);font-size:13px;font-weight:500;white-space:nowrap}
.b.primary{background:var(--primary);color:#fff;box-shadow:none;font-weight:600}
.b.link{background:none;box-shadow:none;color:var(--link);padding:0 4px}
.b.x{background:none;box-shadow:none;color:var(--muted);padding:0 6px;font-size:16px}
</style>
</helmet>
<div style="--panel: {{c.panel}}; --text: {{c.text}}; --muted: {{c.muted}}; --line-strong: {{c.lineStrong}}; --lift: {{c.lift}}; --primary: {{c.primary}}; --link: {{c.link}}; min-height: 1100px; background: {{c.desk}}; color: {{c.text}}; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif; -webkit-font-smoothing: antialiased; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px; align-items: center">

<sc-for list="{{states}}" as="s" hint-placeholder-count="3">
<div style="width: 1000px; max-width: 100%">
<div style="font-size: 13px; color: {{c.muted}}; margin: 0 0 8px 4px">{{s.caption}}</div>
<div style="display: flex; background: {{c.bg}}; border-radius: 12px; box-shadow: {{c.shadow}}; overflow: hidden; height: 200px">
<nav style="width: 200px; flex: none; background: {{c.nav}}; padding: 18px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; border-right: .5px solid {{c.line}}">
<div style="font-weight: 700; margin: 0 8px 12px">Homelab Wizard</div>
<div style="padding: 5px 10px">Choose stacks</div>
<div style="padding: 5px 10px; border-radius: 7px; background: {{c.navActive}}; font-weight: 600">Status</div>
<div style="padding: 5px 10px">Backups</div>
<div style="padding: 5px 10px">Settings</div>
</nav>
<main style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 44px; background: {{s.bg}}; border-bottom: .5px solid {{c.line}}">
<span style="color: {{s.markColor}}; font-weight: 700; width: 16px; text-align: center">{{s.mark}}</span>
<span style="font-weight: 600; white-space: nowrap">{{s.head}}</span>
<span style="color: {{c.muted}}; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0">{{s.sub}}</span>
<sc-if value="{{s.bar}}" hint-placeholder-val="{{ false }}"><span style="width: 180px; height: 4px; border-radius: 2px; background: {{c.track}}; overflow: hidden; flex: none"><span style="display: block; height: 100%; width: {{s.bar}}; background: {{c.primary}}"></span></span></sc-if>
<sc-for list="{{s.buttons}}" as="btn" hint-placeholder-count="2"><button class="{{btn.cls}}">{{btn.label}}</button></sc-for>
</div>
<div style="padding: 18px 24px; opacity: .45">
<div style="font-size: 22px; font-weight: 700">Status</div>
<div style="display: flex; gap: 10px; margin-top: 12px">
<div style="flex: 1; height: 64px; border-radius: 10px; background: {{c.panel}}"></div><div style="flex: 1; height: 64px; border-radius: 10px; background: {{c.panel}}"></div><div style="flex: 1; height: 64px; border-radius: 10px; background: {{c.panel}}"></div><div style="flex: 1; height: 64px; border-radius: 10px; background: {{c.panel}}"></div>
</div>
</div>
</main>
</div>
</div>
</sc-for>

<div style="width: 1000px; max-width: 100%">
<div style="font-size: 13px; color: {{c.muted}}; margin: 0 0 8px 4px">The menu bar, with the window closed</div>
<div style="width: 290px; background: {{c.menu}}; border-radius: 10px; box-shadow: {{c.shadow}}; padding: 5px; font-size: 13.5px">
<div style="padding: 4px 10px; font-weight: 600">Homelab: 31 apps running</div>
<div style="padding: 4px 10px; border-radius: 5px; background: {{c.primary}}; color: #fff">Update to 0.15.0</div>
<div style="padding: 4px 10px">Open Homelab Wizard</div>
<div style="height: 1px; background: {{c.line}}; margin: 4px 0"></div>
<div style="padding: 4px 10px">Back up now</div>
<div style="padding: 4px 10px">Quit Homelab Wizard…</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1080,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const c = dark ? {
desk: '#161618', bg: '#1e1e1e', panel: '#2a2a2c', text: '#f5f5f7', muted: '#98989d', line: '#3a3a3c', lineStrong: '#48484a', track: '#3a3a3c', menu: '#333336',
nav: '#262628', navActive: 'rgba(255,255,255,.1)', link: '#409cff', primary: '#0870d9', ok: '#4ade80', soft: 'rgba(8,112,217,.14)', okSoft: 'rgba(74,222,128,.10)',
shadow: '0 0 0 .5px rgba(255,255,255,.1), 0 8px 24px rgba(0,0,0,.35)', lift: 'rgba(0,0,0,.35)'
} : {
desk: '#e8e8ec', bg: '#f5f5f7', panel: '#fff', text: '#1d1d1f', muted: '#636366', line: '#e5e5ea', lineStrong: '#d1d1d6', track: '#e5e5ea', menu: '#f2f2f4',
nav: '#e8e8ec', navActive: '#d6d6db', link: '#0066cc', primary: '#0066cc', ok: '#15803d', soft: 'rgba(0,102,204,.07)', okSoft: 'rgba(21,128,61,.07)',
shadow: '0 0 0 .5px rgba(0,0,0,.1), 0 8px 24px rgba(0,0,0,.08)', lift: 'rgba(0,0,0,.06)'
};
const states = [
  { caption: 'Found (already downloaded)', bg: c.soft, mark: '↑', markColor: c.primary, head: 'Homelab Wizard 0.15.0 is ready', sub: '', bar: '',
    buttons: [{ label: 'What’s new', cls: 'b link' }, { label: 'Later', cls: 'b' }, { label: 'Update now', cls: 'b primary' }] },
  { caption: 'Updating', bg: c.soft, mark: '↻', markColor: c.primary, head: 'Updating…', sub: 'Your apps keep running', bar: '60%', buttons: [] },
  { caption: 'Back, on the new version', bg: c.okSoft, mark: '✓', markColor: c.ok, head: 'Updated to 0.15.0', sub: '', bar: '',
    buttons: [{ label: 'What’s new', cls: 'b link' }, { label: '×', cls: 'b x' }] },
];
return { c, states };
}
}
</script>
</body>
</html>
