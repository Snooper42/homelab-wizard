# homelab_linkwarden: bookmarks for the household, each page kept as a
# screenshot, a PDF, and readable text, in shared collections. Follows
# Linkwarden's own compose file: the app, PostgreSQL (dumped daily by
# `./homelab backup`), and Meilisearch for search. The archives live in
# ./appdata/linkwarden; the search index rebuilds itself.

name: homelab_linkwarden

x-service: &service
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

networks:
  default:
  homelab:
    name: homelab
    external: true

volumes:
  linkwarden-pgdata:
  linkwarden-meilisearch:

services:
  linkwarden:
    <<: *service
    image: ghcr.io/linkwarden/linkwarden:latest
    profiles: [optional]
    environment:
      DATABASE_URL: postgresql://linkwarden:${LINKWARDEN_DB_PASSWORD}@linkwarden-db:5432/linkwarden
      NEXTAUTH_URL: ${LINKWARDEN_URL:-https://bookmarks.${HOMELAB_DOMAIN:-example.com}}/api/v1/auth
      NEXTAUTH_SECRET: ${LINKWARDEN_NEXTAUTH_SECRET}
      MEILI_HOST: http://linkwarden-meilisearch:7700
      MEILI_MASTER_KEY: ${LINKWARDEN_MEILI_MASTER_KEY}
      # The first account made is the administrator; turn sign-ups off
      # once the household has theirs (Settings, or this variable).
      NEXT_PUBLIC_DISABLE_REGISTRATION: ${LINKWARDEN_DISABLE_REGISTRATION:-false}
    ports:
      - ${BIND_IP:-127.0.0.1}:${LINKWARDEN_PORT:-3060}:3000
    volumes:
      - ../../appdata/linkwarden:/data/data
    depends_on: [linkwarden-db, linkwarden-meilisearch]
    networks: [default, homelab]
    x-homelab:
      memory: 700
      url: LINKWARDEN_URL
      name: Linkwarden
      category: documents
      description: Bookmarks for the household, each page kept as a screenshot, a PDF, and text
      subdomain: bookmarks
      web: 3000

  linkwarden-db:
    <<: *service
    image: docker.io/library/postgres:${LINKWARDEN_DB_VERSION:-18}
    profiles: [optional]
    environment:
      POSTGRES_USER: linkwarden
      # Where every major version keeps its data (18 and later default to
      # /var/lib/postgresql/<major>/docker), so homelab db upgrade can move on.
      PGDATA: /var/lib/postgresql/data
      POSTGRES_PASSWORD: ${LINKWARDEN_DB_PASSWORD}
      POSTGRES_DB: linkwarden
    volumes:
      - linkwarden-pgdata:/var/lib/postgresql/data
    x-homelab:
      name: Linkwarden database
      category: system
      description: PostgreSQL for Linkwarden
      internal: true
      dump: postgres
      version: LINKWARDEN_DB_VERSION

  linkwarden-meilisearch:
    <<: *service
    image: getmeili/meilisearch:v1.41.0
    profiles: [optional]
    environment:
      MEILI_MASTER_KEY: ${LINKWARDEN_MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - linkwarden-meilisearch:/meili_data
    # Pinned: Meilisearch's data format changes between versions.
    x-homelab:
      memory: 300
      name: Linkwarden search
      category: system
      description: Meilisearch, Linkwarden's search index (rebuilt from Linkwarden's data)
      web: false
      internal: true
