# homelab_romm: the game library (ROMs, saves, and their artwork) with
# in-browser play, for the Steam Machine and any browser. Follows RomM's
# own compose file with PostgreSQL instead of MariaDB, so `./homelab
# backup` dumps it like the others. Games live on the media drive under
# games/roms/<platform>; RomM's own data in ./appdata/romm.

name: homelab_romm

x-service: &service
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

networks:
  default:
  homelab:
    name: homelab
    external: true

volumes:
  romm-pgdata:
  romm-redis:

services:
  romm:
    <<: *service
    image: rommapp/romm:latest
    profiles: [optional]
    environment:
      ROMM_DB_DRIVER: postgresql
      DB_HOST: romm-db
      DB_PORT: "5432"
      DB_NAME: romm
      DB_USER: romm
      DB_PASSWD: ${ROMM_DB_PASSWORD}
      ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_SECRET_KEY}
      # Optional metadata and artwork (services/media/RomM.md).
      IGDB_CLIENT_ID: ${ROMM_IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${ROMM_IGDB_CLIENT_SECRET:-}
      SCREENSCRAPER_USER: ${ROMM_SCREENSCRAPER_USER:-}
      SCREENSCRAPER_PASSWORD: ${ROMM_SCREENSCRAPER_PASSWORD:-}
      TZ: ${TZ:-UTC}
    ports:
      - ${BIND_IP:-127.0.0.1}:${ROMM_PORT:-7676}:8080
    volumes:
      - ${MEDIA_ROOT:-/Volumes/Media}/games:/romm/library
      - ../../appdata/romm/resources:/romm/resources
      - ../../appdata/romm/assets:/romm/assets
      - ../../appdata/romm/config:/romm/config
      - romm-redis:/redis-data
    depends_on: [romm-db]
    networks: [default, homelab]
    x-homelab:
      memory: 300
      releases: rommapp/romm
      name: RomM
      category: media
      description: The game library, with artwork, saves, and play in the browser
      subdomain: games
      web: 8080
      aliases: [roms, retro, games]

  romm-db:
    <<: *service
    image: docker.io/library/postgres:${ROMM_DB_VERSION:-17}
    profiles: [optional]
    environment:
      POSTGRES_USER: romm
      # Where every major version keeps its data (18 and later default to
      # /var/lib/postgresql/<major>/docker), so homelab db upgrade can move on.
      PGDATA: /var/lib/postgresql/data
      POSTGRES_PASSWORD: ${ROMM_DB_PASSWORD}
      POSTGRES_DB: romm
    volumes:
      - romm-pgdata:/var/lib/postgresql/data
    x-homelab:
      name: RomM database
      category: system
      description: PostgreSQL for RomM
      internal: true
      dump: postgres
      version: ROMM_DB_VERSION
