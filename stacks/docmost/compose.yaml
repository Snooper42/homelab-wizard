# homelab_docmost: the household wiki, with pages, spaces, comments, and
# diagrams (an open-source Notion and Confluence). Follows Docmost's own
# compose file: the app, PostgreSQL (dumped daily by `./homelab backup`), and
# Redis for its queues. Attachments live in ./appdata/docmost.

name: homelab_docmost

x-service: &service
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

networks:
  default:
  homelab:
    name: homelab
    external: true

volumes:
  docmost-pgdata:

services:
  docmost:
    <<: *service
    image: docker.io/docmost/docmost:latest
    profiles: [optional]
    environment:
      APP_URL: ${DOCMOST_URL:-https://wiki.${HOMELAB_DOMAIN:-example.com}}
      APP_SECRET: ${DOCMOST_APP_SECRET}
      DATABASE_URL: postgresql://docmost:${DOCMOST_DB_PASSWORD}@docmost-db:5432/docmost?schema=public
      REDIS_URL: redis://docmost-redis:6379
    ports:
      - ${BIND_IP:-127.0.0.1}:${DOCMOST_PORT:-3040}:3000
    volumes:
      - ../../appdata/docmost:/app/data/storage
    depends_on: [docmost-db, docmost-redis]
    networks: [default, homelab]
    labels:
      - com.centurylinklabs.watchtower.enable=true
    x-homelab:
      url: DOCMOST_URL
      name: Docmost
      category: documents
      description: The household wiki, with pages, spaces, comments, and diagrams
      subdomain: wiki
      web: 3000
      aliases: [notion, confluence]

  docmost-db:
    <<: *service
    image: docker.io/library/postgres:${DOCMOST_DB_VERSION:-17}
    profiles: [optional]
    environment:
      POSTGRES_USER: docmost
      # Where every major version keeps its data (18 and later default to
      # /var/lib/postgresql/<major>/docker), so homelab db upgrade can move on.
      PGDATA: /var/lib/postgresql/data
      POSTGRES_PASSWORD: ${DOCMOST_DB_PASSWORD}
      POSTGRES_DB: docmost
    volumes:
      - docmost-pgdata:/var/lib/postgresql/data
    labels:
      - com.centurylinklabs.watchtower.enable=false
    x-homelab:
      name: Docmost database
      category: system
      description: PostgreSQL for Docmost
      internal: true
      dump: postgres
      version: DOCMOST_DB_VERSION

  docmost-redis:
    <<: *service
    image: docker.io/valkey/valkey:9-alpine
    profiles: [optional]
    labels:
      - com.centurylinklabs.watchtower.enable=false
    x-homelab:
      name: Docmost queue
      category: system
      description: Redis for Docmost's background jobs (rebuilt on its own)
      internal: true
