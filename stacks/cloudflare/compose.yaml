# homelab_cloudflare: the Cloudflare Tunnel. Public hostnames reach the apps
# through Nginx Proxy Manager (http://nginx-proxy-manager:80), so CrowdSec sees
# and blocks tunnel traffic too. No router ports are opened.
#
# cloudflared is on the tunnel's own network only, at a fixed address: the
# proxy takes a visitor's address (CF-Connecting-IP) from that address and
# nowhere else (N21), and the proxy is all the tunnel can reach.
#
# `./homelab domain setup` writes the tunnel's public hostnames for every app
# marked `public: true`; you only create the tunnel and paste its token.

name: homelab_cloudflare

networks:
  tunnel:
    name: homelab-tunnel
    external: true

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    # The image's entrypoint already passes --no-autoupdate; the nightly updates update it.
    command: tunnel run
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks:
      tunnel:
        ipv4_address: 198.18.89.2
    x-homelab:
      releases: cloudflare/cloudflared
      name: Cloudflare Tunnel
      category: network
      description: Publishes the public apps through Cloudflare without opening router ports
      web: false
      requires: [TUNNEL_TOKEN]
