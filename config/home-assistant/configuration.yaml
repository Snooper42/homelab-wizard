# Written by the homelab when Home Assistant was first installed; edit freely.
# It is Home Assistant's own starter configuration plus the http block that
# trusts the proxy, so https://home.<your domain> works from the start.

# Loads the default set of integrations. Do not remove.
default_config:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Requests arrive through Nginx Proxy Manager and Tailscale Serve, at their
# fixed addresses on the homelab-front network: only they may say who a
# visitor is. A device on the Wi-Fi at Home Assistant's own port is taken
# for who it is.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 198.18.89.18
    - 198.18.89.19
