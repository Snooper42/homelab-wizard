# CrowdSec AppSec: the proxy's bouncer sends each request here before
# serving it, and requests that match a rule are blocked. Only the virtual
# patching rules are loaded (exploits of known vulnerabilities in common
# apps), which rarely touch normal traffic; the bouncer lets requests
# through if this component is down. The virtual-patching config comes
# with the collection installed below (COLLECTIONS), unlike
# appsec-default, which upstream changed to also need the generic and
# experimental rules: without them CrowdSec stopped at startup.
appsec_config: crowdsecurity/virtual-patching
labels:
  type: appsec
listen_addr: 0.0.0.0:7422
source: appsec
